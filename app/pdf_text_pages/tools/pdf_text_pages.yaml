identity:
  name: pdf_text_pages
  author: tkosht
  label:
    en_US: PDF Text and Pages
    ja_JP: PDF本文・ページ画像
description:
  human:
    en_US: Convert a PDF file list to completed text and page images; no PDF returns empty outputs.
    ja_JP: PDFリストから完成した本文と全ページ画像を生成し、0件なら空出力で正常終了します。
  llm: Extract text and all page images. Return ready-to-use text and files with matching visible page IDs.
parameters:
  - name: pdf_files
    type: files
    required: false
    label:
      en_US: PDF list
      ja_JP: PDFリスト
    human_description:
      en_US: Select sys.files, another File list, or a single File variable. Order and duplicates are kept; empty is allowed.
      ja_JP: sys.files・任意のFileリスト・単一File変数を指定します。順序と重複を保持し、0件も受け付けます。
    llm_description: PDF File list in original order; zero PDFs returns empty text and files.
    form: llm
  - name: dpi
    type: number
    required: false
    default: 150
    min: 36
    max: 200
    label:
      en_US: Image DPI
      ja_JP: 画像解像度（DPI）
    human_description:
      en_US: Resolution, subject to administrator limits.
      ja_JP: 管理者上限以内の画像解像度です。
    llm_description: Image DPI, 150 by default.
    form: form
extra:
  python:
    source: tools/pdf_text_pages.py
