  /v1/read-region:
    post:
      parameters: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image_id:
                  type: string
                  pattern: ^img_[0-9a-f]{32}$
                region: *id002
                scale:
                  type: number
                  minimum: 0.25
                  maximum: 4
                  default: 2
              required:
              - image_id
              - region
              additionalProperties: false
      responses:
        '200':
          description: Result
