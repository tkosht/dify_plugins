components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
          additionalProperties: true
      required:
