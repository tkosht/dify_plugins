[project]
name = "read-region"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.1", "uvicorn==0.42.0", "Pillow==13.0.0", "python-multipart==0.0.31"]
[dependency-groups]
dev = ["httpx==0.28.1", "dify-plugin==0.10.2", "pytest==9.0.3", "jsonschema==4.26.0", "PyYAML==6.0.3", "ruff==0.15.15", "black==26.5.1", "pip-audit==2.10.0"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "plugin"]
addopts = "-q"
[tool.ruff]
target-version = "py312"
line-length = 88
